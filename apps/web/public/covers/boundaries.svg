<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eddd"/>
      <stop offset="1" stop-color="#e4e8d3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17231d" stroke-opacity=".09"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="905" cy="210" r="250" fill="none" stroke="#2f5d50" stroke-opacity=".35"/>
  <circle cx="905" cy="210" r="170" fill="#dce9bb" fill-opacity=".5"/>
  <circle cx="905" cy="210" r="92" fill="#2f5d50"/>
  <path d="M0 590C220 430 360 620 590 470s370-40 610-210" fill="none" stroke="#17231d" stroke-width="1.5"/>
  <path d="M0 630C220 470 380 660 610 510s370-40 590-210" fill="none" stroke="#17231d" stroke-opacity=".4"/>
  <path d="M0 670C230 510 400 700 630 550s350-40 570-200" fill="none" stroke="#17231d" stroke-opacity=".2"/>
  <g fill="#17231d" font-family="Georgia, 'Songti SC', serif">
    <text x="78" y="116" font-size="17" letter-spacing="6">FIELD NOTE / 01</text>
    <text x="74" y="280" font-size="92" letter-spacing="-3">BOUNDARIES</text>
    <text x="78" y="350" font-size="34" fill="#2f5d50" letter-spacing="8">把系统做小</text>
    <text x="78" y="394" font-size="34" fill="#2f5d50" letter-spacing="8">把边界做清楚</text>
  </g>
  <g font-family="monospace" fill="#17231d" opacity=".55">
    <text x="78" y="690" font-size="12" letter-spacing="4">SYSTEM / DATA / TEAM</text>
    <text x="1010" y="690" font-size="12" letter-spacing="4" text-anchor="end">2026</text>
  </g>
  <rect width="1200" height="750" filter="url(#noise)" opacity=".8"/>
</svg>
